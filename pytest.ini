[pytest]
# Make `pytest` work from the repo root without ad-hoc PYTHONPATH exports.
# CHANGE X / companion use package imports (`changex.*`, `companion.*`);
# borsa_bot historically used flat imports that expect `borsa_bot/` on sys.path.
pythonpath = . borsa_bot
testpaths =
    changex/tests
    companion/tests
    borsa_bot/tests
norecursedirs =
    .git
    .venv
    venv
    node_modules
    build
    dist
    __pycache__
    .cursor
    changex_app
    borsa_app
addopts = -ra
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
