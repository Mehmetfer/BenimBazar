name: benimbazaar
description: BenimBazaar — İlan, al-sat uygulaması

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  shared_preferences: ^2.2.3

  # UI
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  flutter_staggered_grid_view: ^0.7.0

  # State management — basit, öğrenmesi kolay
  provider: ^6.1.2

  # Yardımcılar
  intl: ^0.19.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
