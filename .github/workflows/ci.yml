name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changex-pytest:
    name: CHANGE X pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Run CHANGE X pytest suite
        run: python -m pytest changex/tests -q --tb=short

  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Run API security regression suite
        run: python -m pytest changex/tests/test_api_security_hardening.py -q --tb=short

  image-e2e:
    name: Image E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Run listing image / photo E2E suites
        run: >
          python -m pytest
          changex/tests/test_listing_image_e2e.py
          changex/tests/test_listing_photo_fullstack.py
          changex/tests/test_listing_photo_edit.py
          -q --tb=short

  api-e2e:
    name: API E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Run core API + upload/queue suites
        run: >
          python -m pytest
          changex/tests/test_core_v1.py
          changex/tests/test_core_v1_1_idempotency.py
          changex/tests/test_upload_and_queue_ux.py
          changex/tests/test_my_listings_moderation_ux.py
          -q --tb=short

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: changex_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install Flutter dependencies (lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter test
        run: flutter test

  pytest-collection:
    name: Pytest collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Plain pytest collection must not error
        run: python -m pytest --collect-only -q

      - name: Run borsa_bot tests (PYTHONPATH via pytest.ini)
        run: python -m pytest borsa_bot/tests -q --tb=short

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changex-pytest
      - security-tests
      - image-e2e
      - api-e2e
      - flutter
      - pytest-collection
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        run: |
          echo "changex-pytest=${{ needs.changex-pytest.result }}"
          echo "security-tests=${{ needs.security-tests.result }}"
          echo "image-e2e=${{ needs.image-e2e.result }}"
          echo "api-e2e=${{ needs.api-e2e.result }}"
          echo "flutter=${{ needs.flutter.result }}"
          echo "pytest-collection=${{ needs.pytest-collection.result }}"
          test "${{ needs.changex-pytest.result }}" = "success"
          test "${{ needs.security-tests.result }}" = "success"
          test "${{ needs.image-e2e.result }}" = "success"
          test "${{ needs.api-e2e.result }}" = "success"
          test "${{ needs.flutter.result }}" = "success"
          test "${{ needs.pytest-collection.result }}" = "success"
