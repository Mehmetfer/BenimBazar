# Scoped HARD typecheck for autonomy-critical surfaces only.
# Not repo-wide strict — avoids unrelated noise; G3 fails if these fail.

[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
explicit_package_bases = True
namespace_packages = True
show_error_codes = True
pretty = True
# Keep incremental noise low in CI/agent runs
cache_dir = /tmp/mypy_borsa_autonomy
exclude = (?x)(
    autonomy/evidence/
    | self_improvement/data/
    | agentic_se/data/
  )

# Critical packages (G3 hard gate targets)
[mypy-autonomy.*]
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-crypto.providers.factory]
check_untyped_defs = True

[mypy-crypto.safety]
check_untyped_defs = True

[mypy-execution.safety]
check_untyped_defs = True

[mypy-autonomous.gates]
check_untyped_defs = True

[mypy-autonomous.governors]
check_untyped_defs = True
